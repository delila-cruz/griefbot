<!DOCTYPE html>
<html>

<head>
  <title>
    GriefBot
  </title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="description" content="">
  <meta name="author" content="">
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="src/assets/styles.css">

  <!-- Bootstrap core CSS -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.1/css/bootstrap.min.css"
    integrity="sha384-WskhaSGFgHYWDcbwN70/dfYBj47jz9qbsMId/iRN3ewGhXQFZCSftd1LZCfmhktB" crossorigin="anonymous">

  <main role="main" class="container-fluid">
    <div class="row">
      <div class="left-sidebar col-lg d-none d-lg-block">
        <div id="left-sidebar-container" class="content-container position-fixed mt-3 mt-lg-5 m-lg-4">
          <img width="250" src="src/assets/current-chat-active.svg" alt="Current Chat">
          <br><br>
          <img width="250" src="src/assets/new-chat.svg" alt="New Chat">
          <br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>
          <img width="200" src="src/assets/about.svg" alt="About Page">
        </div>
      </div>
      <div class="chat-panel col-lg-6 minh-full bg-color">
        <div id="phistory" class="chat-history"></div>
        <div id="precent" class="chat-history"></div>
        <div id="passage"></div>
        <div id="animation-container">
          <div class="chat-passage-wrapper">
            <div class="chat-passage">
              <div class="wave">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
              </div>
            </div>
          </div>
        </div>
        <div class="user-response-panel fixed-bottom bg-color">
          <hr>
          <div id="user-response-hint" class="user-response-hint content-container"></div>
          <div id="user-response-panel" class="user-reponse-wrapper"></div>
        </div>

      </div>
      <div class="right-sidebar col-lg offcanvas-collapse">
        <div class="position-fixed ml--3 w-100 w-lg-auto h-100">
          <div id="right-sidebar-container" class="content-container m-3 m-sm-5 m-lg-3 mt-lg-5 m-xl-5 mt-xl-5"></div>
        </div>
      </div>
    </div>
