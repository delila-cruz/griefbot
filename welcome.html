<!-- had to search how to fix it and make the log in work-->

<div class="container-fluid vh-100 d-flex justify-content-center align-items-center bg-light">

  <div class="this-thing shadow-lg bg-white p-4">

    <h3 class="text-center mb-1">Welcome to GriefBot</h3>
    <h4 class="text-center text-muted mb-3">Please log in.</h4>

    <form onsubmit="handleLogin(event)">

      <div class="mb-3">
        <input id="playerName" type="text" class="form-control" placeholder="Your name">
      </div>

      <div class="mb-3">
        <input id="botName" type="text" class="form-control" placeholder="Deceased's name">
      </div>

      <button type="submit" class="btn btn-primary w-100">
        Continue
      </button>

    </form>

    <p class="text-center text-muted mt-3 mb-0">About</p>

  </div>
</div>

<script>
function handleLogin(event) {
  event.preventDefault(); // stops page refresh

  const s = {
    playerName: document.getElementById("playerName").value,
    botName: document.getElementById("botName").value
  };

  // optional: save for next page
  localStorage.setItem("playerName", s.playerName);
  localStorage.setItem("botName", s.botName);

  console.log(s);

  // go to next page
  window.location.href = "index.html";
}
</script>
